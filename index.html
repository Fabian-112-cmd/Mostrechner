<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f4">
<title>Mostrechner</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/pakage/dist/xlsx.full.min.js"></script>
  
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#111;
  background:#f4f4f4
}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:560px;margin:auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 20px}
.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin:0 0 14px;
  box-shadow:0 1px 5px #00000010
}
.card h2{font-size:18px;margin:0 0 14px}
.field{
  display:grid;
  grid-template-columns:1fr 125px 42px;
  gap:8px;
  align-items:center;
  margin:10px 0
}
.field input{
  width:100%;
  font-size:18px;
  padding:11px;
  border:1px solid #bbb;
  border-radius:9px;
  text-align:right
}
.unit{color:#555}
.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:9px 0;
  border-bottom:1px solid #eee
}
.row:last-child{border:0}
.val{font-weight:650;text-align:right}
.sugar{font-size:20px}
.note{font-size:13px;color:#666;margin-top:10px}
.error{color:#a00;font-size:14px;display:none}
</style>
</head>

<body>

<main class="wrap">

<h1>Mostrechner</h1>
<button id="settingsBtn" type="button">⚙️ Einstellungen</button>
<div id="settingsPanel" style="display:none;">
  <h2>⚙️ Einstellungen</h2>

  <div id="settingsList"></div>

  <button id="saveSettings" type="button">Speichern</button>
  <button id="closeSettings" type="button">Abbrechen</button>
</div>

<section class="card">
<h2>Eingabe</h2>

<div class="field">
<label for="liters">Menge</label>
<input id="liters" type="number" min="0" step="1" value="1700">
<span class="unit">Liter</span>
</div>

<div class="field">
<label for="actual">Gemessen</label>
<input id="actual" type="number" min="44" max="124" step="1" value="85">
<span class="unit">°Oe</span>
</div>

<div class="field">
<label for="target">Wunsch</label>
<input id="target" type="number" min="44" max="124" step="1" value="100">
<span class="unit">°Oe</span>
</div>

<div id="err" class="error"></div>

</section>

<div id="results"></div>

<p class="note">
Berechnung Most / Wein
</p>

</main>

<script>

async function ladeDaten() {
  const gespeichert = localStorage.getItem("mostrechnerDosen");

  if (gespeichert) {
    cfg.doses = JSON.parse(gespeichert);
    calc();
    return;
  }

  try {
    const response = await fetch("./daten.json", { cache: "no-store" });
    const daten = await response.json();

    Object.assign(cfg.doses, daten);
    calc();

  } catch (error) {
    console.error("daten.json konnte nicht geladen werden:", error);
  }
}

const cfg={
  doses:{
    "Enzyme":3,
    "Ascobin":150,
    "Schwefel":100,
    "Annamost":300,
    "Kohle":200,
    "Go-Ferm":300,
    "Hefe (Ansatz)":null,
    "Fermoband":3,
    "1. Drittel":500,
    "Hälfte":500
  },
  perLiters:1000,
  sugarFactor:0.35
};

const sugarTable={
44:87,45:90,46:92,47:95,48:98,49:100,
50:103,51:106,52:108,53:111,54:114,
55:116,56:119,57:122,58:124,59:127,
60:130,61:132,62:135,63:138,64:140,
65:143,66:146,67:148,68:151,69:154,
70:158,71:159,72:162,73:164,74:167,
75:170,76:172,77:175,78:178,79:180,
80:183,81:186,82:188,83:191,84:193,
85:196,86:199,87:201,88:204,89:207,
90:209,91:212,92:215,93:217,94:220,
95:223,96:225,97:228,98:231,99:233,
100:236,101:239,102:241,103:244,
104:247,105:249,106:252,107:255,
108:257,109:260,110:263,111:265,
112:268,113:271,114:273,115:276,
116:279,117:281,118:284,119:287,
120:289,121:292,122:295,123:297,
124:300
};

const fmt=(n,d=1)=>
new Intl.NumberFormat(
  "de-DE",
  {maximumFractionDigits:d}
).format(n);

const el=id=>document.getElementById(id);

function dose(name,L){
  const x=cfg.doses[name];
  return x==null ? null : x/cfg.perLiters*L;
}

function card(title,rows){
  return `
  <section class="card">
  <h2>${title}</h2>
  ${rows.map(([n,v,u,cl=""])=>`
    <div class="row ${cl}">
      <span>${n}</span>
      <span class="val">${v}${u?" "+u:""}</span>
    </div>
  `).join("")}
  </section>`;
}

function openSettings() {
  
  const passwort = prompt("Passwort für Einstellungen:");

if (passwort !== "1234") {
  alert("Falsches Passwort!");
  return;
}
  
  const list = el("settingsList");
  list.innerHTML = "";

  Object.entries(cfg.doses).forEach(([name, value]) => {
    list.innerHTML += `
      <div style="margin-bottom:12px;">
        <input class="settingName" type="text" value="${name}">
        <input class="settingValue" type="number" step="any"
               value="${value ?? ""}" placeholder="Dosierung">
      <span>${name === "Fermoband" ? "kg / 1000 L" : "g / 1000 L"}</span>
      </div>
    `;
  });

  el("settingsPanel").style.display = "block";
}

el("settingsBtn").addEventListener("click", openSettings);

el("closeSettings").addEventListener("click", () => {
  el("settingsPanel").style.display = "none";
});
el("saveSettings").addEventListener("click", () => {
  const names = document.querySelectorAll(".settingName");
  const values = document.querySelectorAll(".settingValue");

  const neueDosen = {};

  names.forEach((input, i) => {
    const name = input.value.trim();
    const value = values[i].value;

    if (name) {
      neueDosen[name] = value === "" ? null : Number(value);
    }
  });

  cfg.doses = neueDosen;
  localStorage.setItem("mostrechnerDosen", JSON.stringify(neueDosen));

  el("settingsPanel").style.display = "none";
  calc();
});

function calc(){

  const L=+el("liters").value;
  const a=+el("actual").value;
  const t=+el("target").value;
  const err=el("err");

  err.style.display="none";

  if(!L || !sugarTable[a] || !sugarTable[t]){
    err.textContent=
    "Bitte Menge und °Oe-Werte zwischen 44 und 124 eingeben.";
    err.style.display="block";
    el("results").innerHTML="";
    return;
  }

  const sugar=
    (sugarTable[t]-sugarTable[a]) *
    L *
    cfg.sugarFactor /
    1000;

  let out="";

  out+=card("Enzyme",[
    [Object.keys(cfg.doses)[0],fmt(dose(Object.keys(cfg.doses)[0],L)),"g"],
    [Object.keys(cfg.doses)[1],fmt(dose(Object.keys(cfg.doses)[1],L)),"g"],
    [Object.keys(cfg.doses)[2],fmt(dose(Object.keys(cfg.doses)[2],L)),"g"]
  ]);

  out+=card("Schönung",[
    [Object.keys(cfg.doses)[3],fmt(dose(Object.keys(cfg.doses)[3],L)),"g"],
    [Object.keys(cfg.doses)[4],fmt(dose(Object.keys(cfg.doses)[4],L)),"g"]
  ]);

  out+=card("Hefe / Zucker",[
    [Object.keys(cfg.doses)[5],fmt(dose(Object.keys(cfg.doses)[5],L)),"g"],
[Object.keys(cfg.doses)[6],
  dose(Object.keys(cfg.doses)[6],L)==null
  ?"-"
  :fmt(dose(Object.keys(cfg.doses)[6],L)),
  ""
],
    [Object.keys(cfg.doses)[7],fmt(dose(Object.keys(cfg.doses)[7],L)),"kg"],
    ["Zucker",fmt(sugar,2),"kg","sugar"]
  ]);

  out+=card("DAB / Annanvital",[
    [Object.keys(cfg.doses)[8],fmt(dose(Object.keys(cfg.doses)[8],L)),"g"],
    [Object.keys(cfg.doses)[9],fmt(dose(Object.keys(cfg.doses)[9],L)),"g"]
  ]);

  el("results").innerHTML=out;
}

["liters","actual","target"].forEach(id=>
  el(id).addEventListener("input",calc)
);

calc();
ladeDaten();

</script>

</body>
</html>
